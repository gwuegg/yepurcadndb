<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Эпюр Монжа — конструктор</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1c1c1e;--mut:#8a8f98;--card:#f2f3f5;--c1:#d9480f;--c2:#0b7285;--c3:#5f3dc4;--c4:#2b8a3e;--c5:#e03131}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171a;--fg:#e8eaed;--mut:#9aa0a6;--card:#202327;--c1:#ff8a5c;--c2:#3bc9db;--c3:#b197fc;--c4:#69db7c;--c5:#ff6b6b}}
:root[data-theme=dark]{--bg:#15171a;--fg:#e8eaed;--mut:#9aa0a6;--card:#202327;--c1:#ff8a5c;--c2:#3bc9db;--c3:#b197fc;--c4:#69db7c;--c5:#ff6b6b}
:root{--h:#ff6600;--f:#0066ff;--p:#e600b8;--m:#00a86b;--n:#8a2be2;--s:#e60000;--l:#d49a00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--h:#ff9d4d;--f:#5aa2ff;--p:#ff6fd8;--m:#2ee59d;--n:#c58bff;--s:#ff5c5c;--l:#ffd43b}}
:root[data-theme=dark]{--h:#ff9d4d;--f:#5aa2ff;--p:#ff6fd8;--m:#2ee59d;--n:#c58bff;--s:#ff5c5c;--l:#ffd43b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px;max-width:2000px;margin:auto}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.r{display:flex;gap:6px;align-items:center;margin-bottom:6px}.r b{width:18px}
.r label{display:flex;align-items:center;gap:3px;flex:1}
input[type=number],select{width:100%;min-width:0;padding:6px;border:1px solid var(--mut);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.c{display:block;margin:4px 0}
#res div{margin:6px 0;padding-left:8px;border-left:3px solid var(--mut)}
#cv{position:sticky;top:12px;align-self:start;background:var(--bg);border-radius:12px;border:1px solid var(--card);padding:8px}
svg{touch-action:none;cursor:grab;display:block;width:100%;height:calc(100vh - 60px);min-height:480px;color:var(--fg)}svg text{fill:currentColor}
.zb{position:absolute;top:14px;right:14px;display:flex;gap:6px}.zb button{width:34px;height:34px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font:18px system-ui;cursor:pointer}
@media(max-width:800px){#cv{position:relative;top:0}svg{height:80vh;min-height:360px}}
</style></head><body>
<div class="wrap"><div id="ctl">
<div class="card"><h1>📐 Эпюр Монжа</h1><div style="color:var(--mut)">Ось x направлена влево, П₁ — под осью, П₂ — над осью.</div></div>
<div class="card"><h2>Точки (x, y, z)</h2><div id="pts"></div></div>
<div class="card"><h2>Вариант</h2><select id="var"><option value="1">Нечётный: гор. следы, ⟂ П₂</option><option value="0">Чётный: фронт. следы, ⟂ П₁</option></select></div>
<div class="card"><h2>Задачи</h2>
<label class="c"><input type="checkbox" id="t1" checked disabled> 1. Две проекции точек A, B, C</label>
<label class="c"><input type="checkbox" id="t2" checked> 2. Горизонталь, фронталь, профильная прямая</label>
<div class="r" style="margin-left:22px;color:var(--mut)">
<label>h из<select id="sh"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select></label>
<label>f из<select id="sf"><option value="0">A</option><option value="1" selected>B</option><option value="2">C</option></select></label>
<label>p из<select id="sp"><option value="0">A</option><option value="1">B</option><option value="2" selected>C</option></select></label></div>
<label class="c"><input type="checkbox" id="t3" checked> 3. Следы прямых, расстояние между ними</label>
<div id="trs" style="margin-left:22px"></div>
<label class="c"><input type="checkbox" id="t4" checked> 4. Плоскость через AC и углы наклона</label>
<div class="r" style="margin-left:22px;color:var(--mut)"><label>K: удлин. AC, %<input type="number" id="kl" value="30"></label><label>K: y (⟂П₂) / z (⟂П₁)<input type="number" id="kv" value="20"></label></div>
<label class="c" style="margin-left:22px;color:var(--mut)"><input type="checkbox" id="t4s"> показывать следы Σ₁, Σ₂</label>
<label class="c" style="margin-top:10px"><input type="checkbox" id="pr"> Показать профильную проекцию П₃</label></div>
<div class="card"><h2>Результаты</h2><div id="res"></div></div>
</div>
<div id="cv"><div class="zb"><button id="zi" title="Приблизить">+</button><button id="zo" title="Отдалить">−</button><button id="zr" title="Сбросить масштаб">⌂</button></div><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
<script>
const S=4,eps=1e-9,$=id=>document.getElementById(id),nm=['A','B','C'],def=[[70,15,40],[35,45,10],[10,10,60]];
$('pts').innerHTML=nm.map((n,i)=>`<div class="r"><b>${n}</b>`+['x','y','z'].map((k,j)=>`<label>${k}<input type="number" id="${n}${k}" value="${def[i][j]}"></label>`).join('')+'</div>').join('');
const op=d=>[['v','по варианту'],['h','горизонтальный'],['f','фронтальный'],['b','оба'],['n','нет']].map(([v,t])=>`<option value="${v}"${v==d?' selected':''}>${t}</option>`).join('');
$('trs').innerHTML=[['a','AB','v'],['b','BC','v'],['c','AC','n']].map(([i,n,d])=>`<div class="r"><b style="width:30px">${n}</b><select id="s3${i}">${op(d)}</select></div>`).join('');
$('ctl').addEventListener('input',draw);
const P=id=>['x','y','z'].map(k=>+$(id+k).value);
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const q1=p=>[-p[0]*S,p[1]*S],q2=p=>[-p[0]*S,-p[2]*S],q3=p=>[p[1]*S,-p[2]*S];
let prof=false;
let o,bb,res;
const E=a=>{bb[0]=Math.min(bb[0],a[0]);bb[1]=Math.min(bb[1],a[1]);bb[2]=Math.max(bb[2],a[0]);bb[3]=Math.max(bb[3],a[1])};
function L(a,b,c,w){E(a);E(b);o+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w||1.5}" vector-effect="non-scaling-stroke"/>`}
const ln=(p,q,c,w)=>{L(q1(p),q1(q),c,w);L(q2(p),q2(q),c,w);if(prof)L(q3(p),q3(q),c,w)};
function dot(a,s,c){c=c||'currentColor';E(a);o+=`<circle cx="${a[0]}" cy="${a[1]}" r="RR" fill="${c}"/><text x="${a[0]}" y="${a[1]}" dx="5" dy="-5" style="fill:${c}">${s}</text>`}
const R=(c,t)=>res.push(`<div style="border-color:${c}">${t}</div>`);
function draw(){
const V=nm.map(P);if(V.flat().some(isNaN))return;
const [A,B,C]=V,odd=$('var').value=='1',on=i=>$('t'+i).checked;
o='';bb=[0,0,0,0];res=[];prof=$('pr').checked;
[[0,1],[1,2],[2,0]].forEach(([i,j])=>ln(V[i],V[j],'var(--mut)',1));
V.forEach((p,i)=>{const a=q1(p),b=q2(p);L(a,b,'var(--mut)',.7);dot(a,nm[i]+'₁');dot(b,nm[i]+'₂');if(prof){const c=q3(p),k=p[1]*S;L(a,[k,k],'var(--mut)',.7);L([k,k],c,'var(--mut)',.7);L(b,c,'var(--mut)',.7);dot(c,nm[i]+'₃')}});
if(prof){const k=Math.max(...V.map(p=>p[1]),10)*S+12;L([0,0],[k,k],'var(--mut)',1)}
if(on(2)){
[['h',2,'горизонталь h','M'],['f',1,'фронталь f','N'],['p',0,'профильная p','K']].forEach(([id,k,t,l])=>{
const v=+$('s'+id).value,[pi,qi]=[0,1,2].filter(i=>i!=v);
const p=V[pi],q=V[qi],d=q[k]-p[k];
const D=Math.abs(d)<eps?add(V[v],sub(q,p)):lerp(p,q,(V[v][k]-p[k])/d);
const c='var(--'+id+')';ln(V[v],D,c,3);dot(q1(D),id+'₁',c);dot(q2(D),id+'₂',c);if(prof)dot(q3(D),id+'₃',c);
R(c,`${t}: проведена из ${nm[v]} до пересечения со стороной ${nm[pi]}${nm[qi]} (проекции ${id}₁, ${id}₂)`)})}
if(on(3)){
const tv=odd?'h':'f',tr={h:[],f:[]};
[[A,B,'AB','m','a'],[B,C,'BC','n','b'],[A,C,'AC','l','c']].forEach(([p,q,n,tn,i])=>{
let v=$('s3'+i).value;if(v=='v')v=tv;
const tc='var(--'+tn+')';
(v=='b'?['h','f']:v=='n'?[]:[v]).forEach(kd=>{
const k=kd=='h'?2:1,d=p[k]-q[k],tm=tn+(v=='b'&&kd=='f'?'′':'');
if(Math.abs(d)<eps){R(tc,`Прямая ${n} параллельна ${kd=='h'?'П₁':'П₂'} — ${kd=='h'?'горизонтального':'фронтального'} следа нет`);return}
const t=p[k]/d,T=lerp(p,q,t);T[k]=0;const ts=[0,1,t];
ln(lerp(p,q,Math.min(...ts)),lerp(p,q,Math.max(...ts)),tc,3);
L(q1(T),q2(T),tc,1);dot(q1(T),tm+'₁',tc);dot(q2(T),tm+'₂',tc);if(prof)dot(q3(T),tm+'₃',tc);
R(tc,`След <b>${tm}</b> прямой ${n} (${kd=='h'?'горизонтальный':'фронтальный'}): ${tm}₁, ${tm}₂`);tr[kd].push([T,tm])})});
['h','f'].forEach(kd=>{const a=tr[kd],f=kd=='h'?q1:q2;
for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const[X,x]=a[i],[Y,y]=a[j],dd=kd=='h'?Math.hypot(X[0]-Y[0],X[1]-Y[1]):Math.hypot(X[0]-Y[0],X[2]-Y[2]);
L(f(X),f(Y),'var(--fg)',3.5);R('var(--fg)',`Расстояние между ${kd=='h'?'горизонтальными':'фронтальными'} следами ${x} и ${y}: <b>${dd.toFixed(2)}</b>`)}})}
if(on(4)){
const k=odd?2:1,dx=C[0]-A[0],dk=C[k]-A[k],f=odd?q2:q1,g=odd?q1:q2,col='var(--s)';
const lam=(+$('kl').value||0)/100,K=lerp(A,C,-lam);K[odd?1:2]=+$('kv').value||0;
const al=Math.atan2(Math.abs(dk),Math.abs(dx))*180/Math.PI;
let X0=null,tt=null;
if(Math.abs(dk)>eps){tt=A[k]/(A[k]-C[k]);X0=lerp(A,C,tt)[0]}
const sh=$('t4s').checked,lo=Math.min(0,-lam),hi=sh?Math.max(1,tt!==null&&tt>1?tt:1):1;
o+=`<polygon points="${[A,C,K].map(p=>g(p).join(',')).join(' ')}" fill="${col}" fill-opacity=".15" stroke="none"/>`;
L(f(lerp(A,C,lo)),f(lerp(A,C,hi)),col,3);
ln(A,K,col,3);ln(C,K,col,3);L(q1(K),q2(K),col,.8);
dot(q1(K),'K₁',col);dot(q2(K),'K₂',col);if(prof)dot(q3(K),'K₃',col);
if(sh&&X0!==null){const e=odd?(Math.max(A[1],C[1],K[1],10)+15)*S:-(Math.max(A[2],C[2],K[2],10)+15)*S;
L([-X0*S,0],[-X0*S,e],col,3);
dot([-X0*S,e],odd?'Σ₁':'Σ₂',col);
if(tt>=lo&&tt<=hi)dot(f(lerp(A,C,tt)),odd?'Σ₂':'Σ₁',col)}
const a1=odd?al:90,a2=odd?90:al,a3=90-al;
R(col,`Плоскость Σ = (A, C, K), ⟂ ${odd?'П₂':'П₁'}: ${odd?'K₂ лежит на A₂C₂, поэтому П₂-проекция плоскости — прямая':'K₁ лежит на A₁C₁, поэтому П₁-проекция плоскости — прямая'}${sh?'; следы Σ₁, Σ₂':''}.<br>Углы: к П₁ = <b>${a1.toFixed(1)}°</b>, к П₂ = <b>${a2.toFixed(1)}°</b>, к П₃ = <b>${a3.toFixed(1)}°</b>`)}
const w=bb[2]-bb[0],h=bb[3]-bb[1],m=Math.max(w,h),pad=m*.08+12,fs=m/50;
const lw='stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"';
const ax=`<line x1="${bb[0]-12}" y1="0" x2="${bb[2]+12}" y2="0" ${lw}/><line x1="0" y1="${bb[1]-12}" x2="0" y2="${bb[3]+12}" ${lw}/><text x="${bb[0]-12}" y="0" dx="${-fs*1.2}" dy="${fs*.35}">x</text><text x="0" y="${bb[1]-12}" dx="5" dy="${fs}">z</text><text x="0" y="${bb[3]+12}" dx="5" dy="-4">y₁</text><text x="${bb[0]-12}" y="0" dx="${fs*.6}" dy="-5">П₂</text><text x="${bb[0]-12}" y="0" dx="${fs*.6}" dy="${fs*1.3}">П₁</text>`+(prof?`<text x="${bb[2]+12}" y="0" dx="3" dy="${fs*.35}">y₃</text><text x="${bb[2]+12}" y="${bb[1]-12}" dx="${-fs*2.5}" dy="${fs}">П₃</text>`:'');
const s=$('svg');base={x:bb[0]-pad,y:bb[1]-pad,w:w+2*pad+12,h:h+2*pad};base.cx=base.x+base.w/2;base.cy=base.y+base.h/2;applyVB();s.setAttribute('font-size',fs);
s.innerHTML=ax+o.replace(/RR/g,fs/4);
$('res').innerHTML=res.join('')||'—'}
let base,z=1,px=0,py=0,drag=null;
const sv=$('svg');
function applyVB(){const w=base.w/z,h=base.h/z;sv.setAttribute('viewBox',`${base.cx+px-w/2} ${base.cy+py-h/2} ${w} ${h}`)}
const vbox=()=>sv.getAttribute('viewBox').split(' ').map(Number);
function zoomAt(f,p){const[x,y,w,h]=vbox(),nz=Math.min(30,Math.max(.3,z*f));f=nz/z;const nw=w/f,nh=h/f;
px=p.x-(p.x-x)/f+nw/2-base.cx;py=p.y-(p.y-y)/f+nh/2-base.cy;z=nz;applyVB()}
const cur=e=>{const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(sv.getScreenCTM().inverse())};
const mid=()=>{const[x,y,w,h]=vbox();return{x:x+w/2,y:y+h/2}};
const reset=()=>{z=1;px=py=0;applyVB()};
sv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,cur(e))},{passive:false});
sv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};sv.setPointerCapture(e.pointerId);sv.style.cursor='grabbing'});
sv.addEventListener('pointermove',e=>{if(!drag)return;const r=sv.getBoundingClientRect(),[,,w,h]=vbox(),sc=Math.max(w/r.width,h/r.height);
px-=(e.clientX-drag.x)*sc;py-=(e.clientY-drag.y)*sc;drag={x:e.clientX,y:e.clientY};applyVB()});
const end=()=>{drag=null;sv.style.cursor='grab'};
sv.addEventListener('pointerup',end);sv.addEventListener('pointercancel',end);sv.addEventListener('dblclick',reset);
$('zi').onclick=()=>zoomAt(1.4,mid());$('zo').onclick=()=>zoomAt(1/1.4,mid());$('zr').onclick=reset;
draw();
</script></body></html>
